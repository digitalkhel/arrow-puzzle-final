name: Build Android AAB and APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Web Assets and Capacitor Android with AdMob
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp "DIGITAL-KHEL.png" "www/DIGITAL-KHEL.png" || true
          cp "Arrow puzzle logo.png" "www/Arrow puzzle logo.png" || true

          cat << 'EOF' > package.json
          {
            "name": "arrow-puzzle",
            "version": "1.0.8",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^6.0.0",
              "@capacitor/cli": "^6.0.0",
              "@capacitor/android": "^6.0.0",
              "@capacitor-community/admob": "^6.0.0"
            }
          }
          EOF

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.digitalkhel.arrowpuzzle",
            "appName": "Arrow Puzzle",
            "webDir": "www"
          }
          EOF

          npm install
          npx cap add android
          npx cap sync android

      - name: Configure Fullscreen, AdMob & SDK 36 (Clean Build Without Billing)
        run: |
          VARS="android/variables.gradle"
          if [ -f "$VARS" ]; then
            sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 24/g' "$VARS"
            sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 36/g' "$VARS"
            sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 36/g' "$VARS"
          fi

          cat << 'EOF' > android/app/build.gradle
          apply plugin: 'com.android.application'

          android {
              namespace "com.digitalkhel.arrowpuzzle"
              compileSdk rootProject.ext.compileSdkVersion
              defaultConfig {
                  applicationId "com.digitalkhel.arrowpuzzle"
                  minSdkVersion rootProject.ext.minSdkVersion
                  targetSdkVersion rootProject.ext.targetSdkVersion
                  versionCode 9
                  versionName "1.0.8"
                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
                  aaptOptions {
                      ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
                  }
              }
              signingConfigs {
                  release {
                      storeFile file("../../release.keystore")
                      storePassword "digitalkhel123"
                      keyAlias "dkkey"
                      keyPassword "digitalkhel123"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
                  }
              }
          }

          repositories {
              flatDir{
                  dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
              }
          }

          dependencies {
              implementation fileTree(include: ['*.jar'], dir: 'libs')
              implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
              implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
              implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
              implementation project(':capacitor-android')
              testImplementation "junit:junit:$junitVersion"
              androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
              androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
              implementation project(':capacitor-cordova-android-plugins')
          }

          apply from: 'capacitor.build.gradle'
          EOF

          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties

          cat << 'EOF' > android/app/src/main/java/com/digitalkhel/arrowpuzzle/MainActivity.java
          package com.digitalkhel.arrowpuzzle;

          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (getBridge() != null && getBridge().getWebView() != null) {
                      WebView wv = getBridge().getWebView();
                      WebSettings ws = wv.getSettings();
                      ws.setTextZoom(100);
                  }
                  hideSystemBars();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      hideSystemBars();
                  }
              }

              private void hideSystemBars() {
                  WindowInsetsControllerCompat controller = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                  if (controller != null) {
                      controller.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                      controller.hide(WindowInsetsCompat.Type.systemBars());
                  }
              }
          }
          EOF

          find android/app/src/main/res -name "splash.png" -delete || true
          cat << 'EOF' > android/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="colorPrimary">#E7141A</item>
                  <item name="colorPrimaryDark">#1B212D</item>
                  <item name="colorAccent">#F95F12</item>
                  <item name="android:windowBackground">#FFFFFF</item>
              </style>
              <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
                  <item name="android:background">@null</item>
                  <item name="android:windowBackground">#FFFFFF</item>
              </style>
              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">
                  <item name="android:windowBackground">#FFFFFF</item>
              </style>
          </resources>
          EOF

          STRINGS="android/app/src/main/res/values/strings.xml"
          if [ -f "$STRINGS" ]; then
            sed -i 's|</resources>|    <string name="facebook_app_id">953250167441885</string>\n    <string name="facebook_client_token">d5435ea514ff2a885c8d48939832af0f</string>\n</resources>|g' "$STRINGS"
          fi

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's|<application|    <uses-permission android:name="com.google.android.gms.permission.AD_ID"/>\n    <application|g' "$MANIFEST"
            sed -i 's|</application>|    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-9990400518181461~1917528301"/>\n        <meta-data android:name="com.facebook.sdk.ApplicationId" android:value="@string/facebook_app_id"/>\n        <meta-data android:name="com.facebook.sdk.ClientToken" android:value="@string/facebook_client_token"/>\n    </application>|g' "$MANIFEST"
          fi

          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          if [ -f "www/Arrow puzzle logo.png" ]; then
            for dir in android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi; do
              cp "www/Arrow puzzle logo.png" "$dir/ic_launcher.png" 2>/dev/null || true
              cp "www/Arrow puzzle logo.png" "$dir/ic_launcher_round.png" 2>/dev/null || true
              cp "www/Arrow puzzle logo.png" "$dir/ic_launcher_foreground.png" 2>/dev/null || true
            done
          fi

      - name: Build Signed Release AAB & Signed Release APK
        run: |
          if [ ! -f "release.keystore" ]; then
            keytool -genkey -v -keystore release.keystore -alias dkkey -keyalg RSA -keysize 2048 -validity 10000 -storepass digitalkhel123 -keypass digitalkhel123 -dname "CN=Digital Khel, O=Digital Khel, C=IN"
          fi

          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Upload Signed Release AAB & Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Digital-Khel-Arrow-Puzzle-CLEAN-v9
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            release.keystore
